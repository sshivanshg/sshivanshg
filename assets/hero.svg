<text x="450" y="118" text-anchor="middle" class="k">BUILDER · FOUNDER · ENGINEER</text>
<text x="450" y="232" text-anchor="middle" class="n" fill="url(#txt)"><tspan style="animation-delay:0.60s">S</tspan><tspan style="animation-delay:0.67s">h</tspan><tspan style="animation-delay:0.74s">i</tspan><tspan style="animation-delay:0.81s">v</tspan><tspan style="animation-delay:0.88s">a</tspan><tspan style="animation-delay:0.95s">n</tspan><tspan style="animation-delay:1.02s">s</tspan><tspan style="animation-delay:1.09s">h</tspan><tspan style="animation-delay:1.16s">&#160;</tspan><tspan style="animation-delay:1.23s">G</tspan><tspan style="animation-delay:1.30s">u</tspan><tspan style="animation-delay:1.37s">p</tspan><tspan style="animation-delay:1.44s">t</tspan><tspan style="animation-delay:1.51s">a</tspan></text>
