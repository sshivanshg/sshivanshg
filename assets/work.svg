<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430">
<defs><linearGradient id="ug" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#ff6ac1"/><stop offset="1" stop-color="#3ee0cf"/></linearGradient></defs>
<style>
.h{font:500 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace;letter-spacing:5px;fill:#fff;opacity:.55}
.no{font:400 13px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#fff;opacity:.35}
.t{font:400 30px 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;fill:#fff;letter-spacing:-.5px}
.d{font:italic 400 15px 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;fill:#fff;opacity:.55}
.tg{font:500 10px ui-monospace,'SF Mono',Menlo,Consolas,monospace;letter-spacing:3px;fill:#fff;opacity:.45}
.r{opacity:0;animation:in 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.u{stroke-dasharray:820;stroke-dashoffset:820;animation:dr 1.4s cubic-bezier(.6,0,.2,1) forwards, pulse 6s ease-in-out 3s infinite}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
</style>
<rect width="900" height="430" rx="28" fill="#0b0b14"/>
<rect x=".5" y=".5" width="899" height="429" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
<text x="40" y="50" class="h">SELECTED WORK — 2026</text>
<g class="r" style="animation-delay:0.30s">
<text x="40" y="100" class="no">01</text>
<text x="100" y="102" class="t">Arth Saathi</text>
<text x="100" y="124" class="d">AI-first operating system for India's small shops</text>
<text x="860" y="102" text-anchor="end" class="tg">FLAGSHIP</text>
<line x1="40" y1="138" x2="860" y2="138" stroke="#fff" stroke-opacity=".08"/>
<line x1="40" y1="138" x2="860" y2="138" stroke="url(#ug)" class="u" style="animation-delay:0.70s"/>
</g><g class="r" style="animation-delay:0.48s">
<text x="40" y="168" class="no">02</text>
<text x="100" y="170" class="t">LexVault</text>
<text x="100" y="192" class="d">Contract lifecycle with line-level RAG</text>
<text x="860" y="170" text-anchor="end" class="tg">AI · LEGAL</text>
<line x1="40" y1="206" x2="860" y2="206" stroke="#fff" stroke-opacity=".08"/>
<line x1="40" y1="206" x2="860" y2="206" stroke="url(#ug)" class="u" style="animation-delay:0.88s"/>
</g><g class="r" style="animation-delay:0.66s">
<text x="40" y="236" class="no">03</text>
<text x="100" y="238" class="t">Agora</text>
<text x="100" y="260" class="d">Open-source multi-agent debate arena</text>
<text x="860" y="238" text-anchor="end" class="tg">OSS</text>
<line x1="40" y1="274" x2="860" y2="274" stroke="#fff" stroke-opacity=".08"/>
<line x1="40" y1="274" x2="860" y2="274" stroke="url(#ug)" class="u" style="animation-delay:1.06s"/>
</g><g class="r" style="animation-delay:0.84s">
<text x="40" y="304" class="no">04</text>
<text x="100" y="306" class="t">TinyTales</text>
<text x="100" y="328" class="d">Storybooks &amp; films that kids co-write with AI</text>
<text x="860" y="306" text-anchor="end" class="tg">AI · KIDS</text>
<line x1="40" y1="342" x2="860" y2="342" stroke="#fff" stroke-opacity=".08"/>
<line x1="40" y1="342" x2="860" y2="342" stroke="url(#ug)" class="u" style="animation-delay:1.24s"/>
</g><g class="r" style="animation-delay:1.02s">
<text x="40" y="372" class="no">05</text>
<text x="100" y="374" class="t">DevHelp</text>
<text x="100" y="396" class="d">Your dev environment, set up in one command</text>
<text x="860" y="374" text-anchor="end" class="tg">OSS · CLI</text>
<line x1="40" y1="410" x2="860" y2="410" stroke="#fff" stroke-opacity=".08"/>
<line x1="40" y1="410" x2="860" y2="410" stroke="url(#ug)" class="u" style="animation-delay:1.42s"/>
</g>
</svg>